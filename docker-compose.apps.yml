# =============================================================
# Taz.SaaS — Applications Compose
#
# Tüm mikroservisler ve Gateway.
# Altyapı servisleri (postgres, redis vb.) docker-compose.infra.yml'dedir.
#
# Network: taz-saas-internal — infra compose tarafından oluşturulur (external)
#
# Image tag kontrolü:
#   IMAGE_TAG=latest         → Gitea Registry'den prod imajı (varsayılan)
#   IMAGE_TAG=local          → local docker daemon'daki dev imajı
#
# Kullanım (prod):
#   export IMAGE_TAG=latest
#   docker compose -f docker-compose.apps.yml up -d
#
# Kullanım (local dev):
#   task deploy-local        → imajları build eder, .env.local.apps üretir ve başlatır
# =============================================================
name: Taz.SaaS Applications.BE

services:
  # ─── Vault Service ────────────────────────────────────────
  vault-service:
    image: ${NAMESPACE:-ghcr.io/ademirel-taztech}/vault:${IMAGE_TAG:-latest}
    env_file:
      - .env
      - .env.vault.sync
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:5001
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Sqlite: ${VAULT_SQLITE_CONNECTION:-Data Source=/app/data/vault.db}
      ConnectionStrings__Redis: ${REDIS_URL:-host.docker.internal:6379}
      Vault__InternalApiKey: ${VAULT_INTERNAL_API_KEY}
      Vault__Environment: ${VAULT_DEFAULT_ENV:-dev}
      Auth__Secret: ${AUTH_SECRET}
      Vault__EncryptionKey: ${VAULT_ENCRYPTIONKEY}
      Seq__Url: ${SEQ_URL:-http://taz-seq:5341}
    volumes:
      - ./.data/vault:/app/data
    healthcheck:
      test: ["CMD-SHELL", "grep -q :1389 /proc/net/tcp /proc/net/tcp6"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      taz-saas-internal:
        aliases:
          - vault-service

  # ─── API Gateway ──────────────────────────────────────────
  gateway:
    image: ${NAMESPACE:-ghcr.io/ademirel-taztech}/gateway:${IMAGE_TAG:-latest}
    env_file:
      - .env
      - .env.vault.sync
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:5000

      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Redis: ${REDIS_URL:-host.docker.internal:6379}
      Vault__ServiceUrl: ${VAULT_SERVICE_URL:-http://vault-service:5001} 
      Vault__InternalApiKey: ${VAULT_INTERNAL_API_KEY}
      Vault__Environment: ${VAULT_DEFAULT_ENV:-dev}

      Gateway__VaultUrl: ${VAULT_SERVICE_URL:-http://vault-service:5001}
      Gateway__IdentityUrl: ${Identity_URL:-http://identity:5002}
      Gateway__PaymentUrl: ${Payment_URL:-http://payment:5003}
      Gateway__ContentUrl: ${Content_URL:-http://content:5004}
      Gateway__BcmUrl: ${Bcm_URL:-http://bcm:5005}
      Gateway__AgentUrl: ${Agent_URL:-http://agent:5010}
      Gateway__LlmGatewayUrl: ${LlmGateway_URL:-http://llmgateway:5011}
      Gateway__PromptUrl: ${Prompt_URL:-http://prompt:5012}
      Gateway__KnowledgeUrl: ${Knowledge_URL:-http://knowledge:5013}
      Gateway__ToolRegistryUrl: ${ToolRegistry_URL:-http://toolregistry:5014}
      Gateway__ConversationUrl: ${Conversation_URL:-http://conversation:5015}
      Gateway__AnalyticsUrl: ${Analytics_URL:-http://analytics:5016}
      Gateway__ConnectorUrl: ${Connector_URL:-http://connector:5017}
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "grep -q :1388 /proc/net/tcp /proc/net/tcp6"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      identity:
        condition: service_healthy
      payment:
        condition: service_healthy
      content:
        condition: service_healthy
      bcm:
        condition: service_healthy
      llmgateway:
        condition: service_healthy
      agent:
        condition: service_healthy
      prompt:
        condition: service_healthy
      knowledge:
        condition: service_healthy
      toolregistry:
        condition: service_healthy
      conversation:
        condition: service_healthy
      analytics:
        condition: service_healthy
      vault-service:
        condition: service_healthy
    networks:
      - taz-saas-internal
      - taz-saas-proxy

  # ─── Identity Service ─────────────────────────────────────
  identity:
    image: ${NAMESPACE:-ghcr.io/ademirel-taztech}/identity:${IMAGE_TAG:-latest}
    env_file:
