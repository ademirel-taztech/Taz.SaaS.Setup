# =============================================================
# Taz.SaaS — Applications Compose
#
# Tüm mikroservisler ve Gateway.
# Altyapı servisleri (postgres, redis vb.) docker-compose.infra.yml'dedir.
#
# Network: taz-saas-internal — infra compose tarafından oluşturulur (external)
#
# Image tag kontrolü:
#   IMAGE_TAG=latest         → Gitea Registry'den prod imajı (varsayılan)
#   IMAGE_TAG=local          → local docker daemon'daki dev imajı
#
# Kullanım (prod):
#   export IMAGE_TAG=latest
#   docker compose -p taz-apps -f docker-compose.apps.yml up -d
#
# Kullanım (local dev):
#   task deploy-local        → imajları build eder, .env.local.apps üretir ve başlatır
#
# ÖNEMLİ: Bu compose dosyasını her zaman `-p taz-apps` ile çalıştır.
# Uygulamalara yalnızca Vault adresi, API anahtarı ve host ortamı verilir.
# Development -> Vault dev, Production -> Vault prod (worker: DOTNET_ENVIRONMENT).
# .env.vault.sync yalnızca Vault'un başlangıç/senkronizasyon kaynağıdır.
# .env, Compose image/resource/bootstrap interpolasyonu için kullanılabilir;
# uygulama container'larına env_file olarak aktarılmaz.
# =============================================================
name: Taz.SaaS Applications.BE

services:
  # ─── Vault Service ────────────────────────────────────────
  vault-service:
    image: ${NAMESPACE:-ghcr.io/ademirel-taztech}/vault:${IMAGE_TAG:-latest}
    env_file:
      - .env.vault.sync
    restart: unless-stopped
    environment:
      Vault__ServiceUrl: ${VAULT_SERVICE_URL:-http://vault-service:5001}
      Vault__InternalApiKey: ${VAULT_INTERNAL_API_KEY}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
    volumes:
      - ./.data/vault:/app/data
    healthcheck:
      test: ["CMD-SHELL", "grep -q :1389 /proc/net/tcp /proc/net/tcp6"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      taz-saas-internal:
        aliases:
          - vault-service

  # ─── API Gateway ──────────────────────────────────────────
  gateway:
    image: ${NAMESPACE:-ghcr.io/ademirel-taztech}/gateway:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      Vault__ServiceUrl: ${VAULT_SERVICE_URL:-http://vault-service:5001}
      Vault__InternalApiKey: ${VAULT_INTERNAL_API_KEY}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
    ports:
      - "127.0.0.1:5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "grep -q :1388 /proc/net/tcp /proc/net/tcp6"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      identity:
        condition: service_healthy
      payment:
        condition: service_healthy
    networks:
      - taz-saas-internal

  # ─── Identity Service ─────────────────────────────────────
  identity:
    image: ${NAMESPACE:-ghcr.io/ademirel-taztech}/identity:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      Vault__ServiceUrl: ${VAULT_SERVICE_URL:-http://vault-service:5001}
      Vault__InternalApiKey: ${VAULT_INTERNAL_API_KEY}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
    healthcheck:
      test: ["CMD-SHELL", "grep -q :138A /proc/net/tcp /proc/net/tcp6"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      vault-service:
        condition: service_healthy
    networks:
      - taz-saas-internal

  # ─── Payment Service ──────────────────────────────────────
  payment:
    image: ${NAMESPACE:-ghcr.io/ademirel-taztech}/payment:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      Vault__ServiceUrl: ${VAULT_SERVICE_URL:-http://vault-service:5001}
      Vault__InternalApiKey: ${VAULT_INTERNAL_API_KEY}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
    healthcheck:
      test: ["CMD-SHELL", "grep -q :138B /proc/net/tcp /proc/net/tcp6"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - taz-saas-internal

  # ─── Content Service ──────────────────────────────────────
  content:
    image: ${NAMESPACE:-ghcr.io/ademirel-taztech}/content:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      Vault__ServiceUrl: ${VAULT_SERVICE_URL:-http://vault-service:5001}
      Vault__InternalApiKey: ${VAULT_INTERNAL_API_KEY}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
    healthcheck:
      test: ["CMD-SHELL", "grep -q :138C /proc/net/tcp /proc/net/tcp6"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      vault-service:
        condition: service_healthy
      identity:
        condition: service_healthy
    networks:
      taz-saas-internal:
        aliases:
          - content-service

  # ─── BCM Service ──────────────────────────────────────────
  bcm:
    image: ${NAMESPACE:-ghcr.io/ademirel-taztech}/bcm:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      Vault__ServiceUrl: ${VAULT_SERVICE_URL:-http://vault-service:5001}
      Vault__InternalApiKey: ${VAULT_INTERNAL_API_KEY}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
    healthcheck:
      test: ["CMD-SHELL", "grep -q :138D /proc/net/tcp /proc/net/tcp6"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      taz-saas-internal:
        aliases:
          - bcm-service

  # ─── LLM Gateway ──────────────────────────────────────────
  llmgateway:
    image: ${NAMESPACE:-ghcr.io/ademirel-taztech}/ai.llmgateway:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      Vault__ServiceUrl: ${VAULT_SERVICE_URL:-http://vault-service:5001}
      Vault__InternalApiKey: ${VAULT_INTERNAL_API_KEY}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
    healthcheck:
      test: ["CMD-SHELL", "grep -q :1393 /proc/net/tcp /proc/net/tcp6"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      taz-saas-internal:
        aliases:
          - llmgateway-service

  # ─── Prompt Service ───────────────────────────────────────
  prompt:
    image: ${NAMESPACE:-ghcr.io/ademirel-taztech}/ai.prompt:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      Vault__ServiceUrl: ${VAULT_SERVICE_URL:-http://vault-service:5001}
      Vault__InternalApiKey: ${VAULT_INTERNAL_API_KEY}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
    healthcheck:
      test: ["CMD-SHELL", "grep -q :1394 /proc/net/tcp /proc/net/tcp6"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - llmgateway
    networks:
      taz-saas-internal:
        aliases:
          - prompt-service

  # ─── Knowledge Service ────────────────────────────────────
  knowledge:
    image: ${NAMESPACE:-ghcr.io/ademirel-taztech}/ai.knowledge:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      Vault__ServiceUrl: ${VAULT_SERVICE_URL:-http://vault-service:5001}
      Vault__InternalApiKey: ${VAULT_INTERNAL_API_KEY}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
    healthcheck:
      test: ["CMD-SHELL", "grep -q :1395 /proc/net/tcp /proc/net/tcp6"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - llmgateway
    networks:
      taz-saas-internal:
        aliases:
          - knowledge-service

  # ─── ToolRegistry Service ─────────────────────────────────
  toolregistry:
    image: ${NAMESPACE:-ghcr.io/ademirel-taztech}/ai.toolregistry:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      Vault__ServiceUrl: ${VAULT_SERVICE_URL:-http://vault-service:5001}
      Vault__InternalApiKey: ${VAULT_INTERNAL_API_KEY}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
    volumes:
      - ./.data/toolregistry-keys:/app/data-protection-keys
    healthcheck:
      test: ["CMD-SHELL", "grep -q :1396 /proc/net/tcp /proc/net/tcp6"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      taz-saas-internal:
        aliases:
          - toolregistry-service

  # ─── Conversation Service ─────────────────────────────────
  conversation:
    image: ${NAMESPACE:-ghcr.io/ademirel-taztech}/ai.conversation:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      Vault__ServiceUrl: ${VAULT_SERVICE_URL:-http://vault-service:5001}
      Vault__InternalApiKey: ${VAULT_INTERNAL_API_KEY}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
    healthcheck:
      test: ["CMD-SHELL", "grep -q :1397 /proc/net/tcp /proc/net/tcp6"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - llmgateway
    networks:
      taz-saas-internal:
        aliases:
          - conversation-service

  # ─── Agent Service ────────────────────────────────────────
  agent:
    image: ${NAMESPACE:-ghcr.io/ademirel-taztech}/ai.agent:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      Vault__ServiceUrl: ${VAULT_SERVICE_URL:-http://vault-service:5001}
      Vault__InternalApiKey: ${VAULT_INTERNAL_API_KEY}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
    healthcheck:
      test: ["CMD-SHELL", "grep -q :1392 /proc/net/tcp /proc/net/tcp6"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - llmgateway
      - conversation
      - toolregistry
      - prompt
      - knowledge
    networks:
      taz-saas-internal:
        aliases:
          - agent-service

  # ─── Workflow Service ──────────────────────────────────────
  workflow:
    image: ${NAMESPACE:-ghcr.io/ademirel-taztech}/ai.workflow:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      Vault__ServiceUrl: ${VAULT_SERVICE_URL:-http://vault-service:5001}
      Vault__InternalApiKey: ${VAULT_INTERNAL_API_KEY}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
    healthcheck:
      test: ["CMD-SHELL", "grep -q :139B /proc/net/tcp /proc/net/tcp6"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - agent
      - llmgateway
      - conversation
      - toolregistry
      - prompt
      - knowledge
    networks:
      taz-saas-internal:
        aliases:
          - workflow-service

  # ─── Connector API ───────────────────────────────────────
  connector:
    image: ${NAMESPACE:-ghcr.io/ademirel-taztech}/ai.connector:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      Vault__ServiceUrl: ${VAULT_SERVICE_URL:-http://vault-service:5001}
      Vault__InternalApiKey: ${VAULT_INTERNAL_API_KEY}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
    healthcheck:
      test: ["CMD-SHELL", "grep -q :1399 /proc/net/tcp /proc/net/tcp6"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      agent:
        condition: service_healthy
      vault-service:
        condition: service_healthy
    networks:
      taz-saas-internal:
        aliases:
          - connector-service

  # ─── Connector Worker ────────────────────────────────────
  connector-worker:
    image: ${NAMESPACE:-ghcr.io/ademirel-taztech}/ai.connector-worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      Vault__ServiceUrl: ${VAULT_SERVICE_URL:-http://vault-service:5001}
      Vault__InternalApiKey: ${VAULT_INTERNAL_API_KEY}
      DOTNET_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
    depends_on:
      connector:
        condition: service_healthy
    networks:
      - taz-saas-internal

  # ─── WebScraping Service ──────────────────────────────────
  webscraping:
    image: ${NAMESPACE:-ghcr.io/ademirel-taztech}/ai.webscraping:${IMAGE_TAG:-latest}
    restart: unless-stopped
    shm_size: "1gb"
    environment:
      Vault__ServiceUrl: ${VAULT_SERVICE_URL:-http://vault-service:5001}
      Vault__InternalApiKey: ${VAULT_INTERNAL_API_KEY}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
    healthcheck:
      test: ["CMD-SHELL", "grep -qi ':139A' /proc/net/tcp /proc/net/tcp6"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      llmgateway:
        condition: service_healthy
      vault-service:
        condition: service_healthy
    networks:
      taz-saas-internal:
        aliases:
          - webscraping-service

  # ─── GuardRail Service ─────────────────────────────────────
  # Cluster-içi inference servisi; gateway route'u YOKTUR, sadece /internal çağrıları alır.
  guardrail:
    image: ${NAMESPACE:-ghcr.io/ademirel-taztech}/ai.guardrail:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # Ayarlanabilir limitler:
    #   GUARDRAIL_CPUS=2
    #   GUARDRAIL_MEMORY_LIMIT=2g
    cpus: ${GUARDRAIL_CPUS:-2}
    mem_limit: ${GUARDRAIL_MEMORY_LIMIT:-2g}
    environment:
      Vault__ServiceUrl: ${VAULT_SERVICE_URL:-http://vault-service:5001}
      Vault__InternalApiKey: ${VAULT_INTERNAL_API_KEY}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
    volumes:
      - ./models/guardrail:/models/guardrail:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/5020; printf \"GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      vault-service:
        condition: service_healthy
    networks:
      taz-saas-internal:
        aliases:
          - guardrail-service

  # ─── Slm Service ───────────────────────────────────────────
  # Cluster-içi inference servisi; gateway route'u YOKTUR, sadece /internal çağrıları alır.
  slm:
    image: ${NAMESPACE:-ghcr.io/ademirel-taztech}/ai.slm:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # Ayarlanabilir limitler:
    #   SLM_CPUS=4
    #   SLM_MEMORY_LIMIT=4g
    cpus: ${SLM_CPUS:-4}
    mem_limit: ${SLM_MEMORY_LIMIT:-4g}
    environment:
      Vault__ServiceUrl: ${VAULT_SERVICE_URL:-http://vault-service:5001}
      Vault__InternalApiKey: ${VAULT_INTERNAL_API_KEY}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
    volumes:
      - ./models/slm:/models/slm:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/5022; printf \"GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      vault-service:
        condition: service_healthy
    networks:
      taz-saas-internal:
        aliases:
          - slm-service

  # ─── Embedding Service ─────────────────────────────────────
  # Cluster-içi inference servisi; gateway route'u YOKTUR, sadece /internal çağrıları alır.
  embedding:
    image: ${NAMESPACE:-ghcr.io/ademirel-taztech}/ai.embedding:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # Ayarlanabilir limitler:
    #   EMBEDDING_CPUS=2
    #   EMBEDDING_MEMORY_LIMIT=3g
    cpus: ${EMBEDDING_CPUS:-2}
    mem_limit: ${EMBEDDING_MEMORY_LIMIT:-3g}
    environment:
      Vault__ServiceUrl: ${VAULT_SERVICE_URL:-http://vault-service:5001}
      Vault__InternalApiKey: ${VAULT_INTERNAL_API_KEY}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
    volumes:
      - ./models/embedding:/models/embedding:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/5021; printf \"GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      vault-service:
        condition: service_healthy
    networks:
      taz-saas-internal:
        aliases:
          - embedding-service

  # ─── Speech Service (STT/TTS) ──────────────────────────────
  # Python/FastAPI (faster-whisper + piper-tts) — .NET DEĞİL. Diğer AI inference
  # servislerinin (guardrail/embedding/slm) aksine gateway route'u VARDIR
  # (/api/ai/speech/** — mobil/web istemciler doğrudan kullanır).
  speech:
    image: ${NAMESPACE:-ghcr.io/ademirel-taztech}/ai.speech:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # Ayarlanabilir limitler:
    #   SPEECH_CPUS=4
    #   SPEECH_MEMORY_LIMIT=4g
    cpus: ${SPEECH_CPUS:-4}
    mem_limit: ${SPEECH_MEMORY_LIMIT:-4g}
    environment:
      Vault__ServiceUrl: ${VAULT_SERVICE_URL:-http://vault-service:5001}
      Vault__InternalApiKey: ${VAULT_INTERNAL_API_KEY}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
    volumes:
      - ./models/whisper-small:/app/models/whisper-small:ro
      - ./models/piper:/app/models/piper:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5023/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    networks:
      taz-saas-internal:
        aliases:
          - speech-service

  # ─── Analytics Service ────────────────────────────────────
  analytics:
    image: ${NAMESPACE:-ghcr.io/ademirel-taztech}/ai.analytics:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      Vault__ServiceUrl: ${VAULT_SERVICE_URL:-http://vault-service:5001}
      Vault__InternalApiKey: ${VAULT_INTERNAL_API_KEY}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
    healthcheck:
      test: ["CMD-SHELL", "grep -q :1398 /proc/net/tcp /proc/net/tcp6"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      taz-saas-internal:
        aliases:
          - analytics-service

  # ─── Business Service ───────────────────────────────────────
  business:
    image: ${NAMESPACE:-ghcr.io/ademirel-taztech}/business:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      Vault__ServiceUrl: ${VAULT_SERVICE_URL:-http://vault-service:5001}
      Vault__InternalApiKey: ${VAULT_INTERNAL_API_KEY}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
    healthcheck:
      test: ["CMD-SHELL", "grep -q :138E /proc/net/tcp /proc/net/tcp6"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      vault-service:
        condition: service_healthy
    networks:
      taz-saas-internal:
        aliases:
          - business-service

networks:
  taz-saas-internal:
    name: taz-saas-internal
    external: true
