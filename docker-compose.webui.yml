 #   networks:
 #     - taz-saas-proxy
  taz-landing:
    image: ${REGISTRY:-ghcr.io}/${NAMESPACE:-ademirel-taztech}/taz-taz-landing:${TAG:-latest}
    platform: linux/amd64   # ← bunu ekle
    restart: unless-stopped
    ports:
      - "${LANDING_PORT:-3005}:3005"
    env_file:
      - .env
    networks:
      - taz-saas-proxy
  widget:
    image: ${REGISTRY:-ghcr.io}/${NAMESPACE:-ademirel-taztech}/taz-widget:${TAG:-latest}
    platform: linux/amd64   # ← bunu ekle
    restart: unless-stopped
    ports:
      - "${WIDGET_PORT:-5173}:5173"
    env_file:
      - .env
    networks:
      - taz-saas-proxy

networks:
  taz-saas-proxy:
    external: true